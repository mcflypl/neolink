[package]
name = "neolink"
description = "A standards-compliant bridge to Reolink IP cameras"
version = "0.8.0"
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition = "2018"
license = "AGPL-3.0-or-later"

[workspace]
members = [
  "crates/*",
]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
byte-slice-cast = {version = "1.2.3", optional = true}
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
crossbeam-channel = {version = "0.5.17", optional = true}
env_logger = "0.11.11"
futures = "0.3.34"
gstreamer = {version = "0.25.4", optional = true}
gstreamer-app = { version = "0.25.2", features = ["v1_20"], optional = true }
gstreamer-rtsp = { version = "0.25.0", features = ["v1_20"], optional = true }
gstreamer-rtsp-server = { version = "0.25.2", features = ["v1_20"], optional = true }
heck = "0.5.0"
log = { version = "0.4.34", features = [ "release_max_level_debug" ] }
neolink_core = { path = "crates/core", version = "0.8.0" }
once_cell = "1.21.4"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.1"
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "tracing"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["full", "tracing"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
validator = {version="0.21.0", features = ["derive"] }

# jemalloc does not build for Windows targets, MSVC or MinGW
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7"

[features]
default = ["gstreamer"]
gstreamer = [
  "dep:gstreamer",
  "dep:gstreamer-app",
  "dep:gstreamer-rtsp",
  "dep:gstreamer-rtsp-server",
  "dep:byte-slice-cast",
  "dep:crossbeam-channel"
]
