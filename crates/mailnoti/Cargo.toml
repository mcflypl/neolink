[package]
name = "mailnoti"
version = "0.8.0"
edition = "2021"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
env_logger = "0.11.11"
get_if_addrs = "0.5.3"
lazy_static = "1.5.1"
log = { version = "0.4.34", features = [ "release_max_level_debug" ] }
mailin-embedded = "0.8.3"
neolink_core = { path = "../core", version = "0.8.0" }
once_cell = "1.21.4"
regex = "1.13.1"
serde = "1.0.229"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
validator = {version="0.21.0", features = ["derive"] }
