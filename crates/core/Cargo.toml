[package]
name = "neolink_core"
description = "Core services and structure for Reolink IP cameras"
version = "0.8.0"
authors = ["George Hilliard <thirtythreeforty@gmail.com>", "Andrew King <sheepchaan@gmail.com>"]
edition = "2018"
license = "AGPL-3.0-or-later"

[dependencies]
aes = "0.9.3"
bytes = "1.12.1"
cfb-mode = "0.9.1"
cookie-factory = "0.3.3"
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
delegate = "0.13.5"
futures = "0.3.34"
get_if_addrs = "0.5.3"
lazy_static = "1.5.1"
log = "0.4.34"
md5 = "0.8.1"
nom = { version = "8.0.0", features = ["alloc"] }
nom-language = "0.1.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
time = { version = "0.3.55" , features = [ "macros", "parsing", "local-offset" ]}
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time", "net"] }
tokio-util = { version = "0.7.20", features = ["full", "tracing"] }

[dev-dependencies]
assert_matches = "1.5.0"
env_logger = "*"
indoc = "2.0.8"
